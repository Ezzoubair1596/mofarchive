<!doctype html>
<html lang="en" translate="no" class="notranslate">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0d0a17">
<meta name="description" content="Explore the twelve works of MOF Archive.">
<title>MOF Archive</title>
<link rel="icon" type="image/x-icon" href="./favicon.ico">
<style>
:root{color-scheme:dark;--ink:#0d0a17;--paper:#fff4e8;--muted:#bdb5cb;--accent:#ffa45f;--line:#edcbff27;font-family:system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;color:var(--paper);background:var(--ink)}[hidden]{display:none!important}a{color:inherit;text-decoration:none}button,input{font:inherit}:focus-visible{outline:2px solid #ffb07a;outline-offset:4px}button,a,input{-webkit-tap-highlight-color:transparent}
.wrap{width:min(1140px,calc(100% - 80px));margin-inline:auto}
.top,.foot{background:#0d0a17}.top{position:relative;z-index:2;border-bottom:1px solid var(--line)}.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:68px}.wordmark{display:inline-flex;align-items:center;gap:11px;font-weight:900;letter-spacing:.08em;font-size:.85rem}.mark{display:grid;place-items:center;border:1px solid #ffb5787a;border-radius:50%;width:34px;height:34px;color:#ffc094;background:#ff803123;font-size:1.2rem}.top-link,.foot a{font-size:.85rem;color:#e4d6ec}.top-link:hover,.foot a:hover,.back:hover{color:var(--accent)}
.main{isolation:isolate;position:relative;min-height:calc(100svh - 130px);overflow:clip}.atmosphere{position:absolute;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(90deg,#efe5ff0a 1px,transparent 1px) center top/52px 52px,linear-gradient(#efe5ff0a 1px,transparent 1px) center top/52px 52px,radial-gradient(ellipse at 25% 9%,#773027 0,transparent 42%),radial-gradient(ellipse at 79% 22%,#352264 0,transparent 49%),radial-gradient(ellipse at 80% 83%,#152744 0,transparent 51%),#110d1c}
.hero{display:grid;justify-items:center;align-content:center;min-height:clamp(330px,43vw,475px);position:relative;isolation:isolate;text-align:center;padding:30px 0 39px;overflow:hidden}
.hero::before,.hero::after{content:"";position:absolute;z-index:-1;pointer-events:none;width:min(98%,860px);height:69%;top:10%;border:1px solid #ff916c4d;border-radius:50%;transform:rotate(-12deg);box-shadow:0 0 30px #be67f11c,inset 0 0 24px #ff826419}.hero::after{width:min(93%,780px);height:74%;top:6%;transform:rotate(10deg);border-color:#ce8fff42}
.hero h1{margin:0;animation:enter .75s ease-out both}.hero img{width:min(54vw,445px);height:auto;display:block;filter:drop-shadow(0 12px 18px #08050acc) drop-shadow(0 0 29px #ff793343)}
.explore{display:inline-flex;gap:16px;align-items:center;margin-top:22px;color:#fff3e5;min-height:46px;padding:0 16px 0 20px;border-radius:999px;border:1px solid #ffab7780;background:#200f1d;box-shadow:0 0 26px #ff8d4730;font-size:.85rem;font-weight:750;transition:background .2s,transform .2s;animation:enter .7s .2s backwards}.explore span{color:#ffb77f}.explore:hover{transform:translateY(-3px);background:#603021}
.directory{scroll-margin-top:20px;padding-bottom:62px}
.panel-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:19px}.panel-head h2{font-size:clamp(2.05rem,5vw,3.4rem);line-height:1;margin:0;letter-spacing:-.055em}.search{width:min(100%,270px);display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:#140f23bf;color:#e1bbdc;border-radius:999px;padding:0 14px}.search:focus-within{border-color:var(--accent)}.search input{width:100%;min-width:0;height:44px;color:var(--paper);background:none;border:0;outline:none}.search input::placeholder{color:var(--muted);font-size:.86rem}
.collections{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:0;padding:0;list-style:none}
.tile{--tone:#ff9a61;position:relative;display:grid;grid-template-columns:1fr auto;align-content:space-between;align-items:end;min-height:124px;gap:13px;padding:15px;background:radial-gradient(ellipse at 9% 5%,color-mix(in srgb,var(--tone) 19%,transparent),transparent 65%),#181228;border:1px solid var(--line);border-radius:16px;overflow:hidden;transition:transform .22s,border-color .22s,box-shadow .22s;animation:enter .5s backwards;animation-delay:calc(var(--order) * 32ms)}
.collections li:nth-child(4n+2) .tile{--tone:#da9cff}.collections li:nth-child(4n+3) .tile{--tone:#79dbff}.collections li:nth-child(4n+4) .tile{--tone:#ff91bd}
.tile::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 32%,#fff1df25 49%,transparent 66%);transform:translateX(-102%);pointer-events:none}.tile:hover::after{transform:translateX(102%);transition:transform .65s}.tile:hover,.tile:focus-visible{border-color:var(--tone);transform:translateY(-4px);box-shadow:0 8px 28px color-mix(in srgb,var(--tone) 16%,transparent)}
.tile .category-icon{grid-column:1/-1;display:grid;place-items:center;width:43px;height:43px;border:1px solid color-mix(in srgb,var(--tone) 37%,transparent);border-radius:10px;background:color-mix(in srgb,var(--tone) 12%,transparent);color:var(--tone)}.tile strong{font-size:.92rem;letter-spacing:.015em}.tile .arrow{color:var(--tone)}.notice,.queue p{color:var(--muted)}
.collection{padding-block:35px 56px}.back{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:999px;background:#140e20b3;padding:10px 16px;font-size:.85rem}.collection-head{margin:26px 0}.collection-head h1{font-size:clamp(2.45rem,7vw,5.2rem);line-height:1.07;margin:5px 0 0;text-align:start;overflow-wrap:anywhere}.collection-head h1[dir=rtl]{text-align:left}.number,.count,.duration{font:750 .74rem ui-monospace,monospace;color:#ffc294}
.screen-layout{display:grid;grid-template-columns:minmax(0,2.55fr) minmax(220px,1fr);gap:15px;align-items:start}.screen-shell{padding:1px;border-radius:22px;background:linear-gradient(140deg,#ffb376,#8d58e8 48%,#40bcef);box-shadow:0 12px 45px #08041499,0 0 30px #9e60db3a}.screen{position:relative;display:grid;place-items:center;aspect-ratio:16/9;overflow:hidden;border-radius:21px;text-align:center;background:repeating-linear-gradient(0deg,transparent 0 5px,#fff9ec07 5px 6px),radial-gradient(ellipse at center,#261b3e,#0b0913 69%)}.screen video{position:absolute;inset:0;width:100%;height:100%;background:#000}.screen-message{display:grid;justify-items:center;gap:14px;padding:14px;color:#f5e3f4}.screen-message svg{color:#ffb07e;filter:drop-shadow(0 0 8px #ff845caa)}.queue{border:1px solid var(--line);border-radius:17px;background:#190f29dd;padding:19px}.queue-head{display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:12px}.queue h2,.related h2{margin:0;font-size:1.05rem}.queue p{font-size:.88rem}.queue ol{list-style:none;margin:0;padding:0;display:grid;gap:8px}.queue ol:not(:empty){padding-top:12px}.episode{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;min-height:44px;padding:9px 12px;text-align:start;border:1px solid var(--line);border-radius:8px;background:#241936;color:var(--paper);cursor:pointer}.episode:hover,.episode[aria-pressed=true]{border-color:#ffb376;background:#4b243a}
.related{margin-top:38px}.related div{display:flex;flex-wrap:wrap;gap:8px;margin-top:13px}.related a{padding:9px 12px;background:#1c132b;border:1px solid var(--line);border-radius:8px;font-size:.78rem;font-weight:700}.related a:hover{border-color:var(--accent);color:var(--accent)}.foot{border-top:1px solid var(--line);color:var(--muted);font-size:.8rem}.foot .bar{min-height:62px}
@keyframes enter{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:820px){.wrap{width:calc(100% - 44px)}.collections{grid-template-columns:repeat(3,minmax(0,1fr))}.hero img{width:min(68vw,400px)}}
@media(max-width:600px){.wrap{width:calc(100% - 30px)}.bar{min-height:58px}.hero{min-height:310px;padding:26px 0}.hero img{width:min(82vw,340px);filter:drop-shadow(0 6px 10px #08050acc)}.hero::before,.hero::after{box-shadow:none}.directory{padding-bottom:36px}.panel-head{align-items:start;flex-direction:column;gap:12px;margin-bottom:13px}.search{width:100%}.collections{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.tile{padding:12px;min-height:106px;gap:9px}.tile strong{font-size:.74rem}.tile .category-icon{width:36px;height:36px}.screen-layout{grid-template-columns:minmax(0,1fr)}.collection{padding-block:22px 40px}.related{margin-top:25px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* Studio lighting replaces the grid and orbital lines. */
:root{--studio-tone:#ff9d60;--studio-wash:#78442d;--studio-base:#100e16}
.atmosphere{background:radial-gradient(ellipse at 50% 6%,color-mix(in srgb,var(--studio-wash) 68%,transparent),transparent 53%),radial-gradient(ellipse at 90% 70%,#262b493f,transparent 50%),var(--studio-base)}
.atmosphere::before{content:"";position:absolute;inset:0;opacity:.32;background:repeating-linear-gradient(126deg,transparent 0 93px,#f7c5a60d 93px 94px,transparent 94px 107px,#f7c5a605 107px 108px);mask-image:linear-gradient(#000,transparent 95%)}
.hero::before{top:13%;width:min(78%,700px);height:70%;border:0;border-radius:0;box-shadow:none;transform:none;background:conic-gradient(from 151deg at 50% 0%,transparent 0deg,#ffd0a019 13deg,#ff9a643d 29deg,#ffe0b91c 44deg,transparent 58deg);mask-image:linear-gradient(#000,transparent 95%)}
.hero::after{top:auto;bottom:18%;width:min(79%,720px);height:25%;border:0;box-shadow:none;transform:none;background:radial-gradient(ellipse,#dd773663,transparent 70%);animation:studio-glow 7s ease-in-out infinite alternate}
@keyframes studio-glow{from{opacity:.45}to{opacity:.85}}
.tile{grid-template-columns:auto minmax(0,1fr) auto;align-content:center;align-items:center;min-height:98px;gap:12px;background:radial-gradient(ellipse at 6% 15%,color-mix(in srgb,var(--tone) 17%,transparent),transparent 73%),#191622}
.tile .category-icon{grid-column:auto}.tile strong{font-size:clamp(.96rem,1.45vw,1.16rem);line-height:1.17;letter-spacing:0}.tile .arrow{font-size:.9rem}
.has-work .atmosphere{background:radial-gradient(ellipse at 14% 7%,color-mix(in srgb,var(--studio-wash) 82%,transparent),transparent 54%),radial-gradient(ellipse at 86% 80%,color-mix(in srgb,var(--studio-wash) 40%,transparent),transparent 62%),var(--studio-base)}
.collection .number,.collection .count,.screen-message svg,.related a:hover{color:var(--studio-tone)}
.screen-shell{background:linear-gradient(140deg,var(--studio-tone),var(--studio-wash) 57%,var(--studio-tone));box-shadow:0 12px 32px #08041499}
.screen{background:repeating-linear-gradient(0deg,transparent 0 5px,#fff9ec07 5px 6px),radial-gradient(ellipse,color-mix(in srgb,var(--studio-wash) 65%,#101019),#0b0913 72%)}
.queue,.related a{background:color-mix(in srgb,var(--studio-wash) 22%,#16111e)}.related a:hover,.episode:hover,.episode[aria-pressed=true]{border-color:var(--studio-tone)}
@media(max-width:600px){.hero{min-height:275px;padding-block:27px}.hero img{width:min(80vw,323px)}.hero::after{animation:none}.explore{margin-top:18px}.panel-head{gap:12px}.search{max-width:none}.search input{font-size:16px}.collections{gap:9px}.tile{gap:8px;padding:11px;min-height:74px;grid-template-columns:auto minmax(0,1fr)}.tile .category-icon{width:34px;height:34px}.tile strong{font-size:.92rem}.tile .arrow{display:none}.collection-head{margin-block:20px}.screen-shell{border-radius:15px}.screen{border-radius:14px}.related a{display:inline-flex;align-items:center;min-height:44px}}
@media(max-width:350px){.tile{padding:8px;gap:6px}.tile strong{font-size:.84rem}.tile .category-icon{width:29px;height:29px}}

:root{font-family:"Archive Gothic",system-ui,sans-serif}
:lang(ar){font-family:"Archive Kufi",sans-serif}
.top{overflow:hidden;background:#16101d}.top .bar{justify-content:center;min-height:60px}.archive-banner{isolation:isolate;position:relative;text-align:center;padding:12px 16px;line-height:1.85;font-size:clamp(.8rem,2.3vw,1.15rem);color:#ffe8ce;font-weight:700;transition:transform .25s}.archive-banner bdi{color:#ffad75}.archive-banner::before{content:"";position:absolute;inset:-8px -55px;z-index:-1;background:radial-gradient(ellipse,#f17c4840,transparent 68%);animation:banner-glow 7s ease-in-out infinite alternate;pointer-events:none}.archive-banner:hover,.archive-banner:focus-visible{transform:translateY(-2px);color:#fff}
@keyframes banner-glow{from{transform:translateX(-30%)}to{transform:translateX(30%)}}
.has-work .atmosphere::after{content:"";position:absolute;inset:-15%;background:radial-gradient(ellipse,color-mix(in srgb,var(--studio-tone) 28%,transparent),transparent 55%);opacity:.4;animation:work-glow 16s ease-in-out infinite alternate}
@keyframes work-glow{from{transform:translate3d(-13%,-7%,0)}to{transform:translate3d(13%,9%,0)}}
.collection-head h1:lang(ar){font-size:clamp(1.8rem,5.7vw,4.2rem);line-height:1.5;text-align:right}
@media(max-width:600px){.top .bar{width:calc(100% - 22px);min-height:52px}.archive-banner{padding:8px 2px}.has-work .atmosphere::after{opacity:.29}}

.top{height:34px}.archive-banner{display:flex;align-items:center;width:100%;height:100%;overflow:hidden;padding:0;font-size:.75rem;line-height:1;transform:none!important}.archive-banner::before{display:none}
.ticker-track{display:flex;flex:none;direction:ltr;width:max-content;animation:news-ticker 40s linear infinite}.ticker-group{display:flex;align-items:center;justify-content:space-around;flex:none;min-width:100vw;gap:20px;padding-inline:10px}.ticker-item{white-space:nowrap}.ticker-icon{color:#ff9e68;font-size:.8rem}.archive-banner:focus-visible{outline-offset:-3px}
@keyframes news-ticker{from{transform:translateX(-50%)}to{transform:translateX(0)}}
.has-work .atmosphere::after{background:radial-gradient(ellipse at 42% 38%,color-mix(in srgb,var(--studio-tone) 39%,transparent),transparent 53%);opacity:.64;animation:section-sweep 6s ease-in-out infinite alternate}
@keyframes section-sweep{from{transform:translate3d(-25%,-13%,0)}to{transform:translate3d(28%,18%,0)}}
.tile{min-height:78px;border-color:color-mix(in srgb,var(--tone) 36%,#211b29);box-shadow:0 0 15px color-mix(in srgb,var(--tone) 15%,transparent),inset 0 0 14px color-mix(in srgb,var(--tone) 8%,transparent)}.tile:hover,.tile:focus-visible{box-shadow:0 4px 24px color-mix(in srgb,var(--tone) 34%,transparent),inset 0 0 17px color-mix(in srgb,var(--tone) 14%,transparent)}
@media(max-width:600px){.top{height:30px}.tile{min-height:66px}.has-work .atmosphere::after{opacity:.55}}
@media(prefers-reduced-motion:reduce){.ticker-track{width:100%}.ticker-group{width:100%;padding-inline:3px}.ticker-group~*,.ticker-group .ticker-item~*{display:none}}

.ticker-track{animation-duration:68s}
.hero-brand{position:relative;isolation:isolate;z-index:1}
.hero-brand img{height:auto}
.logo-shine{position:absolute;inset:0;pointer-events:none;mask:var(--logo) center/100% 100% no-repeat;background:linear-gradient(112deg,transparent 42%,#fff8db 49%,transparent 57%) -100% 0/240% 100% no-repeat;mix-blend-mode:screen;animation:logo-glint 9s ease-in-out infinite}
@keyframes logo-glint{0%,67%{background-position:145% 0;opacity:0}70%{opacity:.62}88%{opacity:.62}93%,100%{background-position:-85% 0;opacity:0}}
.hero .explore{z-index:1}
.hero-reel{display:none}
@media(min-width:900px) and (hover:hover) and (pointer:fine){
 .hero{overflow:visible}
 .hero-reel{display:block;position:absolute;left:50%;top:calc(50% - 33px);width:100vw;transform:translate(-50%,-50%);height:clamp(210px,24vw,275px);overflow:hidden;pointer-events:none;mask-image:linear-gradient(90deg,transparent,#000 8%,#000 25%,#0003 42%,transparent 50%,#0003 58%,#000 75%,#000 92%,transparent)}
 .reel-mask{height:100%;mask-image:linear-gradient(0deg,transparent,#000 19%,#000 81%,transparent)}
 .reel-track{display:flex;width:max-content;height:100%;animation:archive-reel 53s linear infinite}
 .reel-group{display:flex;gap:clamp(44px,8vw,135px);padding-right:clamp(44px,8vw,135px);height:100%}
 .reel-frame{width:min(45vw,445px);height:100%;border:1px solid #f8c29d4d;border-radius:20px;opacity:.66;background:linear-gradient(145deg,var(--frame-light,#593a43),#241927 80%);box-shadow:inset 0 0 28px #100b1862}
 .reel-frame--2{--frame-light:#45496d}.reel-frame--3{--frame-light:#735041}.reel-frame--4{--frame-light:#3c5b60}
 @keyframes archive-reel{to{transform:translateX(-50%)}}
}
@media(prefers-reduced-motion:reduce){.logo-shine,.hero-reel{display:none}}

/* Keep the moving light inside a fixed, full-height layer. */
.has-work .atmosphere::after{
 inset:0;
 background:radial-gradient(ellipse at center,color-mix(in srgb,var(--studio-tone) 39%,transparent),transparent 52%) 0% 0%/170% 160% no-repeat;
 animation:section-light-pan 6s ease-in-out infinite alternate;
}
@keyframes section-light-pan{
 from{background-position:0% 5%}
 to{background-position:100% 85%}
}
@media(min-width:900px) and (hover:hover) and (pointer:fine){
 .hero-reel{top:16px;bottom:20px;height:auto;transform:translateX(-50%)}
 .reel-frame{width:auto;aspect-ratio:1.66;flex:none}
}
@media(min-width:900px) and (hover:hover) and (pointer:fine){
 .reel-frame{
  position:relative;overflow:hidden;isolation:isolate;opacity:.77;
  background:linear-gradient(145deg,#e5ecff22,#636b8c10 48%,#1e152c26);
  border-color:#dbe4ff57;
  box-shadow:inset 0 1px 0 #f6e5ff46,0 12px 30px #0a071e46;
 }
 .reel-frame::before{
  content:"";position:absolute;inset:0;
  background:var(--photo) 50% 50%/cover no-repeat;
  opacity:.68;filter:saturate(.82) contrast(.92);
 }
 .reel-frame::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(128deg,#fff7ff3d,transparent 37%,#19122730 60%,#b2c3f328),linear-gradient(0deg,#20142e42,transparent 56%);
 }
 .reel-frame--1::before,.reel-frame--3::before{
  background-size:auto 106%;animation:wide-photo-pan 11s ease-in-out infinite alternate;
 }
 @keyframes wide-photo-pan{from{background-position:100% 50%}to{background-position:0% 50%}}
}
.hero-brand img{filter:drop-shadow(0 10px 16px #110d2aa6) drop-shadow(0 0 23px #b7b5ff42)}

.hero-brand::before{
 content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
 mask:var(--logo) center/100% 100% no-repeat;
 background:
  radial-gradient(ellipse at 13% 71%,#ff9148a8,transparent 53%),
  radial-gradient(ellipse at 85% 18%,#ac81ffb3,transparent 53%),
  linear-gradient(153deg,transparent 34%,#ffe5cc75 41%,#e8e5ff58 46%,transparent 51%);
 mix-blend-mode:soft-light;
}
.logo-shine{
 z-index:2;
 background-image:linear-gradient(112deg,transparent 40%,#ffac6c72 45%,#fff7e0 49%,#a998ff96 53%,transparent 59%);
}
.collection-head h1:lang(ar){font-size:clamp(1.35rem,3.8vw,3.3rem);line-height:1.32}
.queue{min-width:0;display:flex;flex-direction:column;overflow:hidden}
#playlist{overflow:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--studio-tone) transparent;min-height:0;padding-inline-end:4px}
@media(min-width:601px){.queue{contain:size;align-self:stretch}}
@media(max-width:600px){#playlist{max-height:min(40dvh,19rem);padding-bottom:32px;scroll-padding-bottom:32px;overscroll-behavior-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}}
.episode{gap:7px;min-width:0}.episode span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.episode span[lang=ar]{font-size:.76rem;line-height:1.55}.episode .duration{flex:none;font-size:.68rem}
.dub-group summary{min-height:42px;padding:11px 9px;cursor:pointer;color:var(--studio-tone);border:1px solid #ffffff24;border-radius:9px;font-size:.86rem;font-weight:750}
.dub-group details{margin:8px 0 0 9px}.dub-group ol{padding:6px 0 0!important;overflow:visible}
.player-tools{position:absolute;inset:auto 0 0;z-index:2;padding:18px 13px 9px;background:linear-gradient(transparent,#080611ee 45%,#080611);display:grid;gap:2px;color:#fcf6ff}
.player-row{display:flex;align-items:center;gap:9px}.player-row .player-spacer{flex:1}
.player-tools button{background:#ffffff13;border:1px solid #ffffff22;color:inherit;border-radius:9px;display:grid;place-items:center;min-width:36px;min-height:33px;cursor:pointer;padding:0;font-size:17px}
.player-tools button:hover{background:var(--studio-wash)}.player-tools button:disabled{opacity:.5;cursor:default}.player-tools :focus-visible{outline-color:var(--studio-tone)}
.player-clock{font:650 .7rem ui-monospace,monospace;white-space:nowrap}
.player-tools input[type=range]{appearance:none;cursor:pointer;height:19px;margin:0;--progress:0%;--rail:linear-gradient(to right,var(--studio-tone) var(--progress),#ffffff35 var(--progress));background:transparent}
.player-tools input::-webkit-slider-runnable-track{height:4px;border-radius:20px;background:var(--rail)}
.player-tools input::-moz-range-track{height:4px;border-radius:20px;background:var(--rail)}
.player-tools input::-webkit-slider-thumb{appearance:none;background:#fff4fb;border:2px solid var(--studio-tone);width:12px;height:12px;border-radius:50%;margin-top:-4px}
.player-tools input::-moz-range-thumb{background:#fff4fb;border:2px solid var(--studio-tone);width:9px;height:9px;border-radius:50%}
#player-seek{width:100%}#player-volume{width:clamp(38px,6vw,72px)}.screen:fullscreen{width:100%;height:100%;border-radius:0;background:#000}
.hero-brand img{filter:contrast(1.18) saturate(1.25) drop-shadow(0 10px 17px #0b061cc7) drop-shadow(0 0 24px #b56bd275)}
.hero-brand::before{background:linear-gradient(161deg,#fff5d9ec 5%,#ffad6a88 24%,#633db9b5 48%,#9c4fb67c 62%,#fed2a4d4 83%,#fff5e28a 94%);mix-blend-mode:hard-light;opacity:.76}
.logo-shine{background-image:linear-gradient(113deg,transparent 37%,#ad7cff66 44%,#fff6da 49%,#ff915d99 53%,transparent 61%)}
@media(min-width:900px) and (hover:hover) and (pointer:fine){
 .reel-track{animation-duration:86s}
 .reel-group{gap:clamp(30px,5.7vw,96px);padding-right:clamp(30px,5.7vw,96px)}
 .reel-frame::before{content:none}
 .reel-frame video{width:100%;height:100%;object-fit:cover;opacity:.61;display:block;pointer-events:none}
}

.player-tools .icon-pause,.player-tools .icon-mute,.player-tools .icon-collapse{display:none}
#player-toggle[data-active] .icon-play,#player-mute[data-active] .icon-sound,#player-fullscreen[data-active] .icon-expand{display:none}
#player-toggle[data-active] .icon-pause,#player-mute[data-active] .icon-mute,#player-fullscreen[data-active] .icon-collapse{display:block}

#section-title{display:flex;align-items:center;gap:.3em;min-height:1lh}
#section-title .title-text{font-size:calc(1em / 1.2);letter-spacing:.015em;text-shadow:0 0 16px color-mix(in srgb,var(--studio-tone) 26%,transparent)}
#section-title[dir=rtl] .title-text{letter-spacing:normal}
#section-title svg{flex:none;width:.77em;height:.77em;color:var(--studio-tone);animation:title-icon 3s ease-in-out infinite alternate}
@keyframes title-icon{to{transform:translateY(-3px) rotate(-4deg)}}
.game-link,.game-close{display:inline-block;border:1px solid #faab8870;border-radius:10px;padding:8px 16px;margin:8px;color:#fff;background:#3a2338;cursor:pointer}
#game-open{display:block;width:fit-content;margin-inline:auto}
#game-dialog{width:min(440px,90vw);text-align:center;background:#181324;border:1px solid #926e90;border-radius:18px;color:white}
#game-dialog::backdrop{background:#090715cd}

@media(min-width:900px) and (hover:hover) and (pointer:fine){.reel-track{animation-duration:118s}.reel-frame{background:var(--poster) center/cover}.reel-frame video{background:transparent}}

@media(min-width:900px) and (hover:hover) and (pointer:fine){
 .reel-frame{background:#181122;isolation:isolate;opacity:.52}
 .reel-frame video{opacity:1;position:absolute;inset:0}
 .reel-frame::after{z-index:1}
}
#game-dialog{width:min(720px,94vw);max-height:92dvh;overflow:auto;padding:0;background:#15111d}
.game-toolbar{display:flex;align-items:center;gap:8px;padding:7px 12px}
.game-toolbar b{margin-inline-end:auto}.game-toolbar button,#game-choices button{border:1px solid #bb938d55;background:#322331;color:#fff4e7;border-radius:9px;padding:7px 12px;font:inherit;cursor:pointer}
#game-stage{position:relative;isolation:isolate;aspect-ratio:2/1;background-size:cover;background-position:center;overflow:hidden}
#game-character{display:block;height:94%;max-width:85%;object-fit:contain;position:absolute;bottom:0;left:50%;transform:translateX(-50%)}
#game-character.game-title{height:55%;bottom:22%}.game-copy{padding:10px 18px 16px}.game-copy p{font-size:.85rem;line-height:1.85}
#game-choices{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}#game-choices button:hover{background:#573848}
@media(max-height:500px){#game-stage{height:34dvh;aspect-ratio:auto}}
.queue,#playlist,#playlist li,#playlist ol,#playlist details{min-width:0;max-width:100%;box-sizing:border-box}
#playlist{overflow-x:hidden;grid-template-columns:minmax(0,1fr)}
#playlist ol{grid-template-columns:minmax(0,1fr)}
.episode{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto}
.episode span:first-child{white-space:normal;overflow-wrap:anywhere;text-align:start}
@media(min-width:900px){.screen-layout{grid-template-columns:minmax(0,2.1fr) minmax(255px,1fr)}}
#video-hits{display:grid;gap:7px;list-style:none;padding:0}
#video-hits a{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 14px;border:1px solid var(--line);background:#21192b;border-radius:9px}
#video-hits small{color:#f7bb92}
.player-tools{transition:opacity .25s}.player-tools.resting{opacity:0;pointer-events:none}
.panorama{position:absolute;inset:0;overflow:hidden;opacity:.12;pointer-events:none}
.panorama>div{display:flex;width:max-content;height:100%;animation:pan 42s linear infinite}
.panorama video{width:clamp(150px,23vw,340px);height:100%;object-fit:cover;flex:none}
@keyframes pan{to{transform:translateX(-50%)}}
#screen-message{position:relative}.screen:has(#player:not([hidden])) .panorama{display:none}
#enter{color:var(--paper);background:#211528;border:1px solid #f3aa7788;border-radius:99px;padding:13px 28px;cursor:pointer;z-index:1;letter-spacing:.14em;font-weight:800;animation:invite 1.7s ease-in-out infinite}
@keyframes invite{0%,100%{opacity:1}50%{opacity:.28}}
body:not(.intro) #enter,.intro .explore,.intro :is(.top,.directory,.foot,#collection-view){display:none!important}
.intro .hero{min-height:100svh}.intro .hero-brand img{width:min(78vw,580px)}.intro #enter{margin-top:20px}
.intro .hero-reel{display:block;position:absolute;width:100vw;left:50%;top:15%;bottom:15%;height:auto;transform:translateX(-50%);overflow:hidden;pointer-events:none;mask-image:linear-gradient(90deg,#000 5%,#0004 38%,transparent 50%,#0004 62%,#000 95%)}
.intro .reel-mask,.intro .reel-track,.intro .reel-group{height:100%}.intro .reel-track{width:max-content;display:flex;animation:archive-reel 118s linear infinite}
.intro .reel-group{display:flex;gap:4vw;padding-right:4vw}.intro .reel-frame{position:relative;height:100%;width:clamp(230px,51vw,780px);overflow:hidden;opacity:.488}
.intro .reel-frame video{width:100%;height:100%;object-fit:cover}.intro .reel-mask{mask-image:linear-gradient(0deg,transparent,#000 20%,#000 80%,transparent)}
@keyframes archive-reel{to{transform:translateX(-50%)}}
.arriving .top,.arriving .directory,.arriving .foot{animation:enter .55s both}
.arriving .directory{animation-delay:.18s}.arriving .foot{animation-delay:.34s}
.panorama video{position:static;inset:auto;max-width:none}
.queue,#playlist{overflow-x:hidden}#playlist .dub-group details{margin-inline:0;padding-inline-start:5px}
@media(max-width:600px){.intro .hero-brand img{max-width:88vw}}

.panorama img{display:block;position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#100d17}
#video-hits{--row:3.2rem;grid-auto-rows:var(--row);align-content:start;max-height:calc(16rem + 28px);overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--studio-tone) transparent}
#video-hits a{height:100%;box-sizing:border-box;min-width:0}
#video-hits a span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#video-hits a small{flex:none}
#player-tools{transition:opacity .2s ease-out}#player-tools.resting{transition:opacity .9s ease-in-out}
@media(min-width:1000px){#collection-view{zoom:1.1}}
#facebook-page{display:inline-flex;align-items:center;gap:6px;font-size:inherit}
#facebook-page svg{width:1em;height:1em}

.foot .bar{display:grid;grid-template-columns:1fr minmax(0,20rem) 1fr;gap:12px}
#facebook-page{justify-self:end}
.archive-music{direction:rtl;display:flex;align-items:center;gap:6px;padding:4px 6px;border:1px solid var(--line);border-radius:16px;background:#1b1426;min-width:0;color:var(--paper)}
.archive-music button{display:grid;place-items:center;flex:none;width:30px;height:30px;padding:0;color:var(--paper);background:transparent;border:0;border-radius:9px;cursor:pointer}
.archive-music button:hover,.archive-music button:focus-visible{background:#392644;color:var(--accent)}
.archive-music svg{width:15px;height:15px;fill:currentColor}
#music-title{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;font-size:.72rem}
.music-spectrum{display:flex;flex:none;align-items:center;gap:2px;width:26px;height:18px;margin-inline-end:4px;direction:ltr;color:var(--accent)}
.music-spectrum span{width:3px;height:14px;border-radius:2px;background:currentColor;transform:scaleY(var(--level,.22));opacity:.8}
.music-spectrum{transform:translateX(3px)}#music-toggle{transform:translateX(-3px)}
#game-text{white-space:pre-line}
#game-text:empty{display:none}
#game-choices:empty{min-height:2.75rem}
@media(max-width:700px){
  .foot .bar{grid-template-columns:1fr 1fr;padding-block:12px}
  .archive-music{grid-column:1/-1;grid-row:1;justify-self:center;width:min(100%,20rem)}
}
#game-sound{display:grid;place-items:center;flex:none;min-width:44px;min-height:44px;padding:8px}
#game-sound svg{display:block;width:20px;height:20px}
#game-sound:not([data-muted]) .game-mute-cross,#game-sound[data-muted] .game-volume-waves{display:none}
#game-dialog:not([open]){display:none}
#game-dialog[data-fallback]{display:block;position:fixed;inset:0;margin:auto;height:fit-content;z-index:1000;box-shadow:0 0 0 100vmax #090715e8}
#game-dialog{max-height:92vh;max-height:92dvh;overscroll-behavior:contain}
body.game-open{overflow:hidden}
@media(max-width:600px){
  #game-dialog{width:calc(100% - 16px);max-width:none}
  #game-stage{aspect-ratio:2/1;min-height:100px}
  .game-toolbar{padding:6px 10px}
  .game-toolbar b{font-size:.9rem}
  #game-choices button,#game-open{min-height:44px}
}
#enter{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  line-height:1.2;
  text-indent:.14em;
}
@media(max-width:899px), (hover:none) and (pointer:coarse){
  .intro #home-view{width:100%}
  .intro .hero-reel{left:0;right:0;width:100%;transform:none}
  .has-work .collection-head svg{animation:none}
  .has-work .screen-shell{box-shadow:0 8px 18px #08041466}
  .has-work .player-tools{backdrop-filter:none;-webkit-backdrop-filter:none}
  .has-work .ticker-track{animation-play-state:paused}
  .has-work .top{display:none}
}
.has-work .atmosphere::after{animation:none}
.player-surface{position:absolute;inset:0;display:grid;place-items:center}
body.player-expanded{overflow:hidden}
body.player-expanded .main{z-index:3}
.screen.is-expanded{width:100%;height:100%;aspect-ratio:auto;border-radius:0;background:#000}
.screen.is-expanded .player-surface{background:#000}
.screen.is-expanded video{object-fit:contain}
.skip-hint{position:absolute;right:18%;top:42%;z-index:3;color:#fff4e8;font-weight:800;font-size:1.4rem;text-shadow:0 2px 12px #000;opacity:0;transform:translateY(7px);transition:opacity .18s,transform .18s;pointer-events:none}
.skip-hint.visible{opacity:1;transform:translateY(0)}
@media(max-width:899px){.screen video{touch-action:manipulation}}
.screen.is-expanded[data-fullscreen-fallback]{position:fixed;inset:0;z-index:1000}
.player-replay{position:absolute;z-index:4;display:grid;place-items:center;width:70px;height:70px;border:1px solid #ffbf90;border-radius:50%;color:#fff7eb;background:#241427cf;box-shadow:0 0 28px #ffac7980;cursor:pointer;transition:transform .2s,background .2s}
.player-replay[hidden]{display:none}
.player-replay:hover{transform:scale(1.08);background:#583044}.player-replay svg{width:34px;height:34px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#music-title{position:relative;display:flex;align-items:center;justify-content:center;line-height:1.2;min-height:1.2em}
#music-title .music-title-inner{display:block;white-space:nowrap;max-width:100%}
#music-title .music-title-old{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.intro #enter{opacity:0;animation:enter-reveal .55s ease-out .35s both,invite 1.7s ease-in-out .95s infinite}
@keyframes enter-reveal{from{opacity:0;transform:translateY(13px)}to{opacity:1;transform:translateY(0)}}
.music-dock{display:none}
.deep-web .atmosphere{background:radial-gradient(ellipse at 50% 0%,#155c6166,transparent 60%),repeating-linear-gradient(0deg,#47f3dd08 0 1px,transparent 1px 38px),#090e18}
.deep-web .collection-head{position:relative}.deep-web #section-title{color:#8dfbe9;letter-spacing:.09em;text-shadow:0 0 13px #21f6da8c,0 0 39px #11ae9c88}
.deep-web #section-title:focus{outline:none}
.deep-web #section-title svg{overflow:visible;animation:secret-lock 2.8s ease-in-out infinite alternate;transform-origin:center}
@keyframes secret-lock{from{transform:translateY(1px) rotate(-5deg);filter:drop-shadow(0 0 2px #28f4d8)}to{transform:translateY(-4px) rotate(5deg);filter:drop-shadow(0 0 12px #28f4d8)}}
.deep-web #section-title::after{content:"SECRET PAGE";display:block;margin-inline-start:1em;align-self:center;font-size:.16em;letter-spacing:.22em;color:#a4d9d3;text-shadow:none}
.deep-web .screen-shell{background:linear-gradient(130deg,#0df5c1,#286583 50%,#7af9e1)}
.deep-web .screen{background:repeating-linear-gradient(0deg,#9affeb0a 0 1px,transparent 1px 7px),radial-gradient(ellipse at 50% 40%,#13505a,#07121d 75%)}
.deep-web .queue{border-color:#4be7cc66;background:#0b1820e8}.deep-web .queue-head{color:#9efde8}
.deep-web #playlist .episode:disabled{opacity:.68;cursor:default;border-color:#58ac9a55;background:#112933;color:#b7e9df}
.deep-web #screen-message{color:#b9f9ec}.deep-web .screen-message svg{color:#68f5db}
.deep-web .collection{animation:secret-arrival .8s cubic-bezier(.2,.85,.2,1) both}
.ticker-track{animation-duration:195s}
.ticker-hint{display:grid;align-items:center;text-align:center}.ticker-hint>span{grid-area:1/1}
.ticker-secret{visibility:hidden;color:#97f5e0;text-shadow:0 0 9px #42dac88a}
.ticker-ready .ticker-secret{visibility:visible}.ticker-ready .ticker-default{visibility:hidden}
@keyframes secret-arrival{from{opacity:0;filter:blur(12px);transform:translateY(24px) scale(.985)}to{opacity:1;filter:blur(0);transform:none}}
@media(max-width:899px), (hover:none) and (pointer:coarse){
  .hero{overflow:visible}
  .atmosphere{background:radial-gradient(ellipse 95vw 55vw at 50% 8%,#8b473e90,transparent 100%),radial-gradient(ellipse 115vw 80vw at 50% 30%,#38245880,transparent 100%),#110d1c}
  .intro .hero-reel{top:0;bottom:0;left:0;right:0;width:100%;height:100%;transform:none;mask-image:linear-gradient(0deg,transparent,#000 14%,#000 86%,transparent)}
  .intro .reel-mask{height:100%;mask-image:none}
  .intro .reel-track{display:flex;flex-direction:column;width:100%;height:max-content;animation:archive-reel-up 105s linear infinite}
  .intro .reel-group{display:flex;flex-direction:column;align-items:center;width:100%;height:auto;gap:20px;padding:0 0 20px}
  .intro .reel-frame{width:100vw;max-width:none;height:auto;aspect-ratio:16/9;flex:none;border:0;border-radius:0;opacity:.37;mask-image:linear-gradient(0deg,transparent 0%,#000 17%,#000 83%,transparent 100%)}
  .intro .reel-frame video{width:100%;height:100%;object-fit:cover;opacity:.53}
  #enter{font-size:.64rem;padding:8px 17px;letter-spacing:.08em}
  .explore{font-size:.65rem;min-height:34px;padding:0 12px;gap:8px}
  .foot .bar{grid-template-columns:1fr 1fr;padding-block:12px}
  body:not(.intro) > .archive-music{width:min(20rem,calc(100% - 32px));margin:0 auto 9px;transform:translateX(0)}
  body.intro > .archive-music{display:none}
  .music-dock{display:flex;align-items:center;justify-content:center;padding:12px 0 13px;background:transparent}
  .music-dock .archive-music{width:min(20rem,calc(100% - 32px));margin:0}
  .intro .music-dock{display:none}
}
@keyframes archive-reel-up{from{transform:translateY(0)}to{transform:translateY(-50%)}}
@media (orientation:portrait) {
  .screen.is-expanded[data-landscape] .player-surface{
    inset:50% auto auto 50%;
    width:100vh;
    height:100vw;
    width:100dvh;
    height:100dvw;
    transform:translate(-50%,-50%) rotate(90deg);
  }
}
